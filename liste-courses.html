<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste de Courses – La Boulangerie des Merveilles</title>
  <style>
    :root {
      --bg: #fdf6ec;
      --card: #ffffff;
      --accent: #c8732a;
      --accent-dark: #a05a1e;
      --accent-light: #f5dfc0;
      --text: #2c1a0e;
      --text-muted: #7a5a3a;
      --border: #e8d5b5;
      --done-bg: #f0f0f0;
      --done-text: #aaa;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ──────────── HEADER ──────────── */
    header {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      padding: 20px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5px; }
    header p  { font-size: 0.85rem; opacity: 0.85; }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-white  { background: #fff; color: var(--accent-dark); }
    .btn-white:hover { background: var(--accent-light); }
    .btn-danger { background: #d64242; color: #fff; }
    .btn-danger:hover { background: #b83232; }
    .btn-print  { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5); }
    .btn-print:hover { background: rgba(255,255,255,0.35); }

    /* ──────────── STATS BAR ──────────── */
    .stats-bar {
      background: var(--accent-light);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .stats-bar strong { color: var(--accent-dark); }

    /* ──────────── AJOUTER UN ARTICLE ──────────── */
    .add-section {
      padding: 16px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .add-section h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .add-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .add-form input, .add-form select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      background: var(--bg);
      color: var(--text);
    }
    .add-form input:focus, .add-form select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .input-name  { flex: 2; min-width: 160px; }
    .input-qty   { flex: 0 0 80px; }
    .input-unit  { flex: 0 0 100px; }
    .select-cat  { flex: 1; min-width: 160px; }
    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-add:hover { background: var(--accent-dark); }

    /* ──────────── CATEGORIES ──────────── */
    .categories {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .category-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      background: var(--accent-light);
      border-bottom: 1px solid var(--border);
    }
    .category-header:hover { background: #eecfa0; }
    .cat-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .cat-icon { font-size: 1.2rem; }
    .cat-count {
      font-size: 0.75rem;
      background: var(--accent);
      color: #fff;
      border-radius: 12px;
      padding: 1px 8px;
      font-weight: 700;
    }
    .cat-toggle { font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s; }
    .cat-toggle.closed { transform: rotate(-90deg); }

    .category-body { padding: 8px 0; }

    /* ──────────── ITEMS ──────────── */
    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: #fdf0e0; }
    .item-row.done { background: var(--done-bg); }

    .item-check {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .item-name {
      flex: 1;
      font-size: 0.9rem;
    }
    .item-row.done .item-name {
      text-decoration: line-through;
      color: var(--done-text);
    }
    .item-qty-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-qty-input {
      width: 60px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.82rem;
      text-align: center;
      background: var(--bg);
    }
    .item-qty-input:focus { outline: none; border-color: var(--accent); }
    .item-unit {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-width: 36px;
    }
    .item-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .item-delete:hover { color: #d64242; }

    /* ──────────── DATE ──────────── */
    .date-line {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 6px;
    }

    /* ──────────── PRINT ──────────── */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .category-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
      .item-delete { display: none; }
      .item-check { display: none; }
      .item-row.done { display: none; }
      .btn-add { display: none; }
      header { background: #333; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .categories { padding: 12px; gap: 14px; }
      .add-section { padding: 12px; }
      .stats-bar { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🥐 La Boulangerie des Merveilles</h1>
  <p id="date-display"></p>
  <div class="header-actions no-print">
    <button class="btn btn-white" onclick="resetDone()">↺ Remettre à zéro</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑 Tout supprimer</button>
    <button class="btn btn-print" onclick="window.print()">🖨 Imprimer</button>
  </div>
</header>

<div class="stats-bar no-print" id="stats-bar">
  <span>Total : <strong id="stat-total">0</strong> articles</span>
  <span>Cochés : <strong id="stat-done">0</strong></span>
  <span>Restants : <strong id="stat-remaining">0</strong></span>
</div>

<div class="add-section no-print">
  <h2>+ Ajouter un article</h2>
  <div class="add-form">
    <input class="input-name" type="text" id="new-name" placeholder="Nom de l'article" onkeydown="if(event.key==='Enter') addItem()" />
    <input class="input-qty"  type="number" id="new-qty" placeholder="Qté" min="0" step="0.1" />
    <input class="input-unit" type="text" id="new-unit" placeholder="Unité (kg, L…)" />
    <select class="select-cat" id="new-cat"></select>
    <button class="btn-add" onclick="addItem()">Ajouter</button>
  </div>
</div>

<div class="categories" id="categories-container"></div>

<script>
// ──────────────────────────────────────────────
// DONNÉES PAR DÉFAUT – Boulangerie
// ──────────────────────────────────────────────

    ]

  {

    name: "Arômes & Épices",

    items: [
      { name: "Extrait de vanille",    qty: 0.5, unit: "L" },

  {
    id: "emballages",
    name: "Emballages & Matériel",

      { name: "Sachets à pain kraft",  qty: 200, unit: "unités" },
      { name: "Boîtes à gâteaux",      qty: 100, unit: "unités" },
      { name: "Papier sulfurisé",      qty: 2,   unit: "rouleaux" },

    ]
  },
  {
    id: "entretien",
    name: "Entretien & Hygiène",
    icon: "🧹",
    items: [
      { name: "Gants latex",           qty: 2,  unit: "boîtes" },
      { name: "Désinfectant surfaces", qty: 2,  unit: "L" },
      { name: "Éponges",               qty: 10, unit: "unités" },
      { name: "Essuie-tout",           qty: 4,  unit: "rouleaux" },
      { name: "Sacs poubelle 50L",     qty: 50, unit: "unités" },
    ]
  },
  {
    id: "divers",
    name: "Divers",
    icon: "🔖",
    items: []
  }
];

// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
const STORAGE_KEY = "bdm_courses_v2";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveState(cats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cats));
}

function freshCategories() {
  return DEFAULT_CATEGORIES.map(cat => ({
    ...cat,
    collapsed: false,
    items: cat.items.map((it, i) => ({
      id: `${cat.id}_${i}_${Date.now()}_${Math.random()}`,
      name: it.name,
      qty: it.qty,
      unit: it.unit,
      done: false
    }))
  }));
}

let state = loadState();
if (!state) state = freshCategories();

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function render() {
  saveState(state);
  renderCatSelect();
  renderCategories();
  renderStats();
  renderDate();
}

function renderDate() {
  const el = document.getElementById("date-display");
  const now = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  el.textContent = "Liste du " + now.toLocaleDateString('fr-FR', opts);
}

function renderStats() {
  const allItems = state.flatMap(c => c.items);
  const total     = allItems.length;
  const done      = allItems.filter(i => i.done).length;
  document.getElementById("stat-total").textContent     = total;
  document.getElementById("stat-done").textContent      = done;
  document.getElementById("stat-remaining").textContent = total - done;
}

function renderCatSelect() {
  const sel = document.getElementById("new-cat");
  sel.innerHTML = state.map(c =>
    `<option value="${c.id}">${c.icon} ${c.name}</option>`
  ).join("");
}

function renderCategories() {
  const container = document.getElementById("categories-container");
  container.innerHTML = "";

  state.forEach((cat, ci) => {
    const totalItems = cat.items.length;
    const doneItems  = cat.items.filter(i => i.done).length;

    const card = document.createElement("div");
    card.className = "category-card";

    // HEADER
    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML = `
      <div class="cat-title">
        <span class="cat-icon">${cat.icon}</span>
        <span>${cat.name}</span>
        ${totalItems > 0 ? `<span class="cat-count">${doneItems}/${totalItems}</span>` : ""}
      </div>
      <span class="cat-toggle ${cat.collapsed ? 'closed' : ''}">▼</span>
    `;
    header.addEventListener("click", () => {
      state[ci].collapsed = !state[ci].collapsed;
      render();
    });

    // BODY
    const body = document.createElement("div");
    body.className = "category-body";
    if (cat.collapsed) body.style.display = "none";

    if (totalItems === 0) {
      body.innerHTML = `<div class="date-line" style="padding:12px 16px; color:#bbb; font-style:italic;">Aucun article dans cette catégorie</div>`;
    } else {
      cat.items.forEach((item, ii) => {
        const row = document.createElement("div");
        row.className = "item-row" + (item.done ? " done" : "");

        row.innerHTML = `
          <input type="checkbox" class="item-check" ${item.done ? "checked" : ""}
            onchange="toggleItem(${ci},${ii})" />
          <span class="item-name">${escHtml(item.name)}</span>
          <div class="item-qty-wrap no-print">
            <input type="number" class="item-qty-input" value="${item.qty}"
              min="0" step="0.1"
              onchange="updateQty(${ci},${ii},this.value)" />
            <span class="item-unit">${escHtml(item.unit)}</span>
          </div>
          <div class="print-only" style="display:none; font-size:0.82rem; color:#555;">
            ${item.qty} ${escHtml(item.unit)}
          </div>
          <button class="item-delete no-print" onclick="deleteItem(${ci},${ii})" title="Supprimer">✕</button>
        `;
        body.appendChild(row);
      });
    }

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });
}

// ──────────────────────────────────────────────
// ACTIONS
// ──────────────────────────────────────────────
function toggleItem(ci, ii) {
  state[ci].items[ii].done = !state[ci].items[ii].done;
  render();
}

function updateQty(ci, ii, val) {
  state[ci].items[ii].qty = parseFloat(val) || 0;
  saveState(state);
}

function deleteItem(ci, ii) {
  state[ci].items.splice(ii, 1);
  render();
}

function addItem() {
  const name = document.getElementById("new-name").value.trim();
  if (!name) { document.getElementById("new-name").focus(); return; }

  const qty   = parseFloat(document.getElementById("new-qty").value) || 1;
  const unit  = document.getElementById("new-unit").value.trim() || "unités";
  const catId = document.getElementById("new-cat").value;

  const ci = state.findIndex(c => c.id === catId);
  if (ci < 0) return;

  state[ci].items.push({
    id: `${catId}_custom_${Date.now()}`,
    name,
    qty,
    unit,
    done: false
  });

  document.getElementById("new-name").value = "";
  document.getElementById("new-qty").value  = "";
  document.getElementById("new-unit").value = "";
  document.getElementById("new-name").focus();
  render();
}

function resetDone() {
  state.forEach(cat => cat.items.forEach(it => it.done = false));
  render();
}

function clearAll() {
  if (!confirm("Supprimer tous les articles et repartir de la liste par défaut ?")) return;
  state = freshCategories();
  render();
}

// ──────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
render();
</script>

</html>
